[package]
name = "hyprland-dock"
version = "0.1.1"
edition = "2026"
authors = ["Anas Arifin <anasarifin1995@gmail.com>"]
description = "A lightweight, blazing-fast, and modern dock for Hyprland built with Rust and GTK4"
license = "MIT"
repository = "https://github.com/ExoAcox/hyprland-dock"
readme = "README.md"
keywords = ["hyprland", "dock", "wayland", "gtk4", "layer-shell"]
categories = ["command-line-utilities", "gui"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
gdk-pixbuf = "0.22"
